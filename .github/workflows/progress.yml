name: Update progress

on:
  push:
    paths: [.rustlings-state.txt]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          current=$(sed -n '3p' .rustlings-state.txt)
          completed=$(tail -n +5 .rustlings-state.txt | grep -cve '^$')
          total=$(find exercises -name '*.rs' | wc -l)
          percent=$(((completed * 100 + total / 2) / total))
          sed -i -E \
            -e "s|progress: [0-9]+ of [0-9]+|progress: $completed of $total|" \
            -e "s|progress-bar.xyz/[0-9]+/\?scale=[0-9]+|progress-bar.xyz/$completed/?scale=$total|" \
            -e "s|[0-9]+ of [0-9]+ exercises complete \([0-9]+%\)|$completed of $total exercises complete ($percent%)|" \
            -e "s|Current exercise: .*|Current exercise: \`$current\`|" README.md
          git diff --quiet README.md && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "docs: update progress"
          git push
